manual_seed: 42

model:
  name: UNet3D
  in_channels: 1
  out_channels: 1
  final_sigmoid: true
  f_maps: [16, 32, 64, 128, 256]
  layer_order: cbe          # Conv -> BatchNorm -> ELU  (replaces gcr/GroupNorm)
                             # BatchNorm fuses into Conv at TRT inference -> no reformatting nodes
                             # Requires batch >= 4 during training -> enabled by 64^3 patches below

loss:
  name: BCEDiceLoss

eval_metric:
  name: DiceCoefficient

optimizer:
  learning_rate: 2.0e-04
  weight_decay: 1.0e-05

lr_scheduler:
  name: ReduceLROnPlateau
  mode: max
  factor: 0.5
  patience: 50
  cooldown: 10
  min_lr: 1.0e-08

trainer:
  eval_score_higher_is_better: true
  checkpoint_dir: "/workspace/unet_3d/experiments/cbe_64patch_20260602/checkpoint"
  resume: null
  pre_trained: null         # Cannot warm-start from gcr checkpoint (BatchNorm != GroupNorm weights)
  validate_after_iters: 2000
  log_after_iters: 50
  max_num_epochs: 200
  max_num_iterations: 2000000

loaders:
  dataset: LazyHDF5Dataset  # 7493 files won't fit in RAM if eager-loaded (~316GB float64 -> OOM).
                             # Lazy reads each patch from disk on-the-fly: near-zero dataset RAM.
                             # Opens h5 file per __getitem__ -> fork-safe with num_workers > 0.
  batch_size: 8             # 64^3 patches use ~8x less activation memory than 128^3
                             # -> fits 8 patches/batch on a single GPU (vs 1 at 128^3)
                             # BatchNorm needs batch >= 4 for stable statistics; 8 is safe
  num_workers: 4
  raw_internal_path: raw
  label_internal_path: label

  train:
    file_paths: ["/workspace/unet_3d/data_002/train"]
    slice_builder:
      name: SliceBuilder
      patch_shape: [64, 64, 64]   # 8x smaller volume -> batch_size=8 viable
      stride_shape: [32, 32, 32]  # half-patch overlap: each voxel covered by up to 8 patches
                                   # 7493 files x 27 patches/file = ~202k patches/epoch
                                   # -> ~25k iters/epoch at batch 8: wall-clock bound, NOT epoch bound
    transformer:
      raw:
        - name: Normalize
        - name: ToTensor
          expand_dims: true
      label:
        - name: Identity
        - name: ToTensor
          expand_dims: true

  val:
    file_paths: ["/workspace/unet_3d/data_002/val"]
    slice_builder:
      name: SliceBuilder
      patch_shape: [128, 128, 128]  # full volume for validation -> global Dice score
      stride_shape: [128, 128, 128] # model is fully convolutional: trained on 64^3, infers on 128^3
    transformer:
      raw:
        - name: Normalize
        - name: ToTensor
          expand_dims: true
      label:
        - name: Identity
        - name: ToTensor
          expand_dims: true
