blox:
  world:
    pose: [0, 0, 0, 1, 0, 0, 0]
    "integrator_type": "occupancy"

cuboid:
  floor:
    dims: [10.0, 10.0, 0.1] # x, y, z
    pose: [0.0, 0.0, -0.8, 1, 0, 0, 0.0] # x, y, z, qw, qx, qy, qz (cuRobo order)
  ridgeback:
    dims: [0.8, 0.8, 0.8]
    # Top at -0.07, not -0.05: the m1013's link1 collision sphere reaches z=-0.0415, and
    # with the top at -0.05 every configuration was in collision (cuRobo v2 activation 0.01).
    pose: [0.0, 0.0, -0.47, 1.0, 0.0, 0.0, 0.0]
  camera_pole:
    dims: [0.1, 0.1, 3.0]
    pose: [0.0, -0.40, 0.00, 1.0, 0.0, 0.0, 0.0]
