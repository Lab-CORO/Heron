[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "heron"
version = "0.1.0"
description = "Reachability datasets and 3D U-Net training for robot workspaces"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6", "numpy", "scipy", "h5py", "matplotlib"]

[project.optional-dependencies]
test = ["pytest>=7"]
# Keep in step with requirements-train.txt (the training image installs that file).
train = ["pytorch3dunet==1.9.6", "torch>=2.2"]
# Keep in step with requirements-trt.txt (which says how to install it on Alliance clusters).
trt = ["tensorrt-cu13==10.16.*", "onnx", "onnxscript>=0.7"]

[project.scripts]
heron = "heron.cli:main"

[tool.setuptools.packages.find]
include = ["heron*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
